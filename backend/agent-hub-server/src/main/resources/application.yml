spring:
  application:
    name: agent-hub-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agent_hub}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
agent-hub:
  security:
    jwt:
      secret: ${AGENT_HUB_JWT_SECRET:agent-hub-demo-secret-agent-hub-demo-secret}
      ttl-hours: ${AGENT_HUB_JWT_TTL_HOURS:12}
  storage:
    endpoint: ${AGENT_HUB_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${AGENT_HUB_STORAGE_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${AGENT_HUB_STORAGE_ACCESS_KEY:agenthub}
    secret-key: ${AGENT_HUB_STORAGE_SECRET_KEY:agenthub123}
    bucket: ${AGENT_HUB_STORAGE_BUCKET:agent-hub-chat-images}
    skill-bucket: ${AGENT_HUB_STORAGE_SKILL_BUCKET:agent-hub-skill-packages}
    image-expire-days: ${AGENT_HUB_STORAGE_IMAGE_EXPIRE_DAYS:7}
    presigned-upload-ttl-minutes: ${AGENT_HUB_STORAGE_PRESIGNED_UPLOAD_TTL_MINUTES:10}
    presigned-read-ttl-minutes: ${AGENT_HUB_STORAGE_PRESIGNED_READ_TTL_MINUTES:10}
    pending-cleanup-minutes: ${AGENT_HUB_STORAGE_PENDING_CLEANUP_MINUTES:60}
    unused-ready-cleanup-hours: ${AGENT_HUB_STORAGE_UNUSED_READY_CLEANUP_HOURS:24}
  sandbox:
    base-url: ${AGENT_HUB_SANDBOX_BASE_URL:http://172.16.112.183:8090}
    internal-token: ${AGENT_HUB_SANDBOX_INTERNAL_TOKEN:dev-sandbox-token}
    command-max-length: ${AGENT_HUB_SANDBOX_COMMAND_MAX_LENGTH:8192}
    exec-timeout-seconds: ${AGENT_HUB_SANDBOX_EXEC_TIMEOUT_SECONDS:300}
  logging:
    path: logs/agent-hub
    access-log-enabled: true
    max-history: 15
    max-file-size: 20MB
logging:
  level:
    root: INFO
    com.agenthub: INFO
    org.springframework.security: WARN
    com.baomidou.mybatisplus: INFO
    org.flywaydb: INFO
server:
  port: ${SERVER_PORT:8080}
