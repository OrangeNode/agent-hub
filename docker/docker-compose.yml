name: agent-hub-deps

services:
  postgres:
    image: postgres:16
    container_name: agent-hub-postgres
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agent-hub-network

  redis:
    image: redis:7.2
    container_name: agent-hub-redis
    restart: unless-stopped
    env_file:
      - ./env/redis.env
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agent-hub-network

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: agent-hub-minio
    restart: unless-stopped
    env_file:
      - ./env/minio.env
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agent-hub-network

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    container_name: agent-hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./env/minio.env
    entrypoint:
      - sh
      - -c
      - |
        mc alias set agent-hub http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "agent-hub/$$MINIO_BUCKET_CHAT_IMAGES"
        cat > /tmp/chat-image-cors.xml <<EOF
        <CORSConfiguration>
          <CORSRule>
            <AllowedOrigin>*</AllowedOrigin>
            <AllowedMethod>GET</AllowedMethod>
            <AllowedMethod>PUT</AllowedMethod>
            <AllowedMethod>HEAD</AllowedMethod>
            <AllowedHeader>*</AllowedHeader>
            <ExposeHeader>ETag</ExposeHeader>
          </CORSRule>
        </CORSConfiguration>
        EOF
        mc cors set "agent-hub/$$MINIO_BUCKET_CHAT_IMAGES" /tmp/chat-image-cors.xml
        cat > /tmp/chat-image-lifecycle.json <<EOF
        {
          "Rules": [
            {
              "ID": "expire-chat-images-after-seven-days",
              "Status": "Enabled",
              "Expiration": {
                "Days": $$MINIO_IMAGE_EXPIRE_DAYS
              }
            }
          ]
        }
        EOF
        mc ilm rule import "agent-hub/$$MINIO_BUCKET_CHAT_IMAGES" < /tmp/chat-image-lifecycle.json
    networks:
      - agent-hub-network

networks:
  agent-hub-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
